<!-- Frappe Intelligence's dual-tone module icons for the desk dock, sidebars and headers. Each symbol animates
     while its dock tile is hovered, through the icon-motion custom properties the tile sets
     (frappe/public/scss/desk/dock.scss): `icon-motion` (paused | running) and
     `icon-motion-opacity` (0 | 1).

     A name must end in `-duotone` for the dock to draw it on the 24px grid with the tile's tones.
     Every id, class and custom property is prefixed `frappe_intelligence-` so nothing clashes with another app's
     sprite.

     This sprite is inserted into the page, so the style block below is a document stylesheet. -->

<svg id="frappe_intelligence-module-symbols" aria-hidden="true" style="display: none;" class="icon" xmlns="http://www.w3.org/2000/svg">
	<style>
		/* The Frappe Intelligence colours, from the logo's violet spark and indigo tile: the body of a shape and its detail. light-dark() picks
		   per theme; the dark theme uses a deep body and a light detail so the pair reads on a dark tray.
		     rest     light: #A993FF / #1E1B4B     dark: #4C3FA0 / #E4DEFF
		     active   light: #896aff / #12102d     dark: #5648b6 / #fdfdff */
		:root {
			--frappe_intelligence-body: light-dark(#A993FF, #4C3FA0);
			--frappe_intelligence-detail: light-dark(#1E1B4B, #E4DEFF);
			--frappe_intelligence-body-active: light-dark(#896aff, #5648b6);
			--frappe_intelligence-detail-active: light-dark(#12102d, #fdfdff);
		}
		/* Frappe's sprite sets grey tones on every duotone tile and header. These win for Frappe Intelligence's
		   icons only, through the symbol the tile holds, so other apps keep their own. */
		.dock-item--duotone:has(use[href^="#icon-frappe_intelligence-"]),
		.shell-header:hover .header-logo:has(use[href^="#icon-frappe_intelligence-"]),
		.shell-header.hover .header-logo:has(use[href^="#icon-frappe_intelligence-"]) {
			--duotone-light: var(--frappe_intelligence-body);
			--duotone-dark: var(--frappe_intelligence-detail);
		}
		.dock-item--duotone.active:has(use[href^="#icon-frappe_intelligence-"]) {
			--duotone-light: var(--frappe_intelligence-body-active);
			--duotone-dark: var(--frappe_intelligence-detail-active);
		}

		/* Home: the front door swings open on its left hinge. */
		.frappe_intelligence-door {
			transform-box: fill-box;
			transform-origin: left center;
			transform: scaleX(calc(1 - 0.7 * var(--icon-motion-opacity, 0)));
			transition: transform 0.3s ease;
		}

		/* Assistant: the dots type in turn. */
		.frappe_intelligence-dot {
			animation: frappe_intelligence-blink 1.6s ease-in-out infinite;
			animation-play-state: var(--icon-motion, paused);
		}
		.frappe_intelligence-dot:nth-child(2) { animation-delay: 0.15s; }
		.frappe_intelligence-dot:nth-child(3) { animation-delay: 0.3s; }
		@keyframes frappe_intelligence-blink {
			0%, 45%, 100% { opacity: 1; }
			20% { opacity: 0.25; }
		}

		/* Analytics: the bars grow in turn. */
		.frappe_intelligence-bar {
			transform-box: fill-box;
			transform-origin: center bottom;
			animation: frappe_intelligence-grow 2s ease-out infinite;
			animation-play-state: var(--icon-motion, paused);
		}
		.frappe_intelligence-bar:nth-child(2) { animation-delay: 0.2s; }
		.frappe_intelligence-bar:nth-child(3) { animation-delay: 0.4s; }
		@keyframes frappe_intelligence-grow {
			0%, 45%, 100% { transform: scaleY(1); }
			8% { transform: scaleY(0.2); }
			30% { transform: scaleY(1); }
		}

		/* Workflows: the branch is drawn again. */
		.frappe_intelligence-branch {
			stroke-dasharray: 20;
			animation: frappe_intelligence-draw 1.8s ease-out infinite;
			animation-play-state: var(--icon-motion, paused);
		}
		@keyframes frappe_intelligence-draw {
			0%, 50%, 100% { stroke-dashoffset: 0; }
			10% { stroke-dashoffset: 20; }
		}

		/* Workflow Builder: a block lifts and snaps back into place. */
		.frappe_intelligence-block {
			animation: frappe_intelligence-lift 1.6s ease-in-out infinite;
			animation-play-state: var(--icon-motion, paused);
		}
		@keyframes frappe_intelligence-lift {
			0%, 60%, 100% { transform: translateY(0); }
			25% { transform: translateY(-2px); }
		}

		/* Documents and Processing Log: the lines are written again, left to right. */
		.frappe_intelligence-line {
			transform-box: fill-box;
			transform-origin: left center;
			animation: frappe_intelligence-write 2s ease-out infinite;
			animation-play-state: var(--icon-motion, paused);
		}
		.frappe_intelligence-line:nth-child(2) { animation-delay: 0.2s; }
		.frappe_intelligence-line:nth-child(3) { animation-delay: 0.4s; }
		@keyframes frappe_intelligence-write {
			0%, 45%, 100% { transform: scaleX(1); }
			8% { transform: scaleX(0); }
			30% { transform: scaleX(1); }
		}

		/* Document Requirements: the tick is drawn again. */
		.frappe_intelligence-check {
			stroke-dasharray: 12;
			animation: frappe_intelligence-tick 1.8s ease-out infinite;
			animation-play-state: var(--icon-motion, paused);
		}
		@keyframes frappe_intelligence-tick {
			0%, 50%, 100% { stroke-dashoffset: 0; }
			10% { stroke-dashoffset: 12; }
		}

		/* Training Pairs: the two arrows swap sides. */
		.frappe_intelligence-swap,
		.frappe_intelligence-swap-back {
			animation: frappe_intelligence-swap 1.6s ease-in-out infinite;
			animation-play-state: var(--icon-motion, paused);
		}
		.frappe_intelligence-swap-back { animation-name: frappe_intelligence-swap-back; }
		@keyframes frappe_intelligence-swap {
			0%, 100% { transform: translateX(0); }
			50% { transform: translateX(1.5px); }
		}
		@keyframes frappe_intelligence-swap-back {
			0%, 100% { transform: translateX(0); }
			50% { transform: translateX(-1.5px); }
		}

		/* Knowledge Packs: the leaning book tips further out of the row. */
		.frappe_intelligence-book {
			transform-box: view-box;
			transform-origin: 16.1px 20.5px;
			animation: frappe_intelligence-tip 1.8s ease-in-out infinite;
			animation-play-state: var(--icon-motion, paused);
		}
		@keyframes frappe_intelligence-tip {
			0%, 60%, 100% { transform: rotate(0); }
			25%, 40% { transform: rotate(-12deg); }
		}

		/* Post Processors: the gear turns. */
		.frappe_intelligence-gear {
			transform-box: view-box;
			transform-origin: 12px 12px;
			animation: frappe_intelligence-turn 4s linear infinite;
			animation-play-state: var(--icon-motion, paused);
		}
		@keyframes frappe_intelligence-turn {
			to { transform: rotate(360deg); }
		}

		/* Setup: the slider knobs move along their tracks, in opposite directions. */
		.frappe_intelligence-knob,
		.frappe_intelligence-knob-back {
			animation: frappe_intelligence-slide 1.6s ease-in-out infinite;
			animation-play-state: var(--icon-motion, paused);
		}
		.frappe_intelligence-knob-back { animation-name: frappe_intelligence-slide-back; animation-delay: 0.2s; }
		@keyframes frappe_intelligence-slide {
			0%, 100% { transform: translateX(0); }
			50% { transform: translateX(4px); }
		}
		@keyframes frappe_intelligence-slide-back {
			0%, 100% { transform: translateX(0); }
			50% { transform: translateX(-4px); }
		}
	</style>

	<!-- Home: a house with a door. -->
	<symbol viewBox="0 0 24 24" id="icon-frappe_intelligence-home-duotone" stroke="none" style="overflow: visible">
		<path d="M4.5 10.2 12 4.3l7.5 5.9V20a1.5 1.5 0 0 1-1.5 1.5H6A1.5 1.5 0 0 1 4.5 20z" style="fill: var(--duotone-light, var(--frappe_intelligence-body))" />
		<path d="M2.6 11 12 3.3l9.4 7.7" style="fill: none; stroke: var(--duotone-dark, var(--frappe_intelligence-detail)); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round" />
		<rect class="frappe_intelligence-door" x="9.8" y="14" width="4.4" height="7.5" rx="1" style="fill: var(--duotone-dark, var(--frappe_intelligence-detail))" />
	</symbol>

	<!-- Assistant: a chat bubble with typing dots. -->
	<symbol viewBox="0 0 24 24" id="icon-frappe_intelligence-assistant-duotone" stroke="none" style="overflow: visible">
		<path d="M5 4H19A2.5 2.5 0 0 1 21.5 6.5V14A2.5 2.5 0 0 1 19 16.5H10L5.5 20V16.5H5A2.5 2.5 0 0 1 2.5 14V6.5A2.5 2.5 0 0 1 5 4Z" style="fill: var(--duotone-light, var(--frappe_intelligence-body))" />
		<g style="fill: var(--duotone-dark, var(--frappe_intelligence-detail))"><circle class="frappe_intelligence-dot" cx="8" cy="10.3" r="1.4" /><circle class="frappe_intelligence-dot" cx="12" cy="10.3" r="1.4" /><circle class="frappe_intelligence-dot" cx="16" cy="10.3" r="1.4" /></g>
	</symbol>

	<!-- Session Analytics: three rising bars with a trend line. -->
	<symbol viewBox="0 0 24 24" id="icon-frappe_intelligence-analytics-duotone" stroke="none" style="overflow: visible">
		<g style="fill: var(--duotone-light, var(--frappe_intelligence-body))"><rect class="frappe_intelligence-bar" x="3.5" y="13" width="4" height="8" rx="1" /><rect class="frappe_intelligence-bar" x="10" y="9" width="4" height="12" rx="1" /><rect class="frappe_intelligence-bar" x="16.5" y="5.5" width="4" height="15.5" rx="1" /></g>
		<path d="M5.5 9.5 12 5.5l6.5-2.7" style="fill: none; stroke: var(--duotone-dark, var(--frappe_intelligence-detail)); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round" />
	</symbol>

	<!-- Workflows: three steps joined by a branch. -->
	<symbol viewBox="0 0 24 24" id="icon-frappe_intelligence-workflows-duotone" stroke="none" style="overflow: visible">
		<g style="fill: var(--duotone-light, var(--frappe_intelligence-body))"><rect x="2.5" y="3" width="7" height="5" rx="1.6" /><rect x="14.5" y="9.5" width="7" height="5" rx="1.6" /><rect x="2.5" y="16" width="7" height="5" rx="1.6" /></g>
		<path class="frappe_intelligence-branch" d="M6 8V16M6 12H14.5" style="fill: none; stroke: var(--duotone-dark, var(--frappe_intelligence-detail)); stroke-width: 1.8; stroke-linecap: round" />
	</symbol>

	<!-- Workflow Builder: a board with two connected blocks. -->
	<symbol viewBox="0 0 24 24" id="icon-frappe_intelligence-builder-duotone" stroke="none" style="overflow: visible">
		<rect x="2.5" y="2.5" width="19" height="19" rx="3.5" style="fill: var(--duotone-light, var(--frappe_intelligence-body))" />
		<rect x="5.5" y="5.5" width="6" height="4.5" rx="1.2" style="fill: var(--duotone-dark, var(--frappe_intelligence-detail))" />
		<path d="M8.5 10V16.2H12.5" style="fill: none; stroke: var(--duotone-dark, var(--frappe_intelligence-detail)); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round" />
		<rect class="frappe_intelligence-block" x="12.5" y="14" width="6" height="4.5" rx="1.2" style="fill: var(--duotone-dark, var(--frappe_intelligence-detail))" />
	</symbol>

	<!-- Documents: a page with a folded corner and text lines. -->
	<symbol viewBox="0 0 24 24" id="icon-frappe_intelligence-documents-duotone" stroke="none" style="overflow: visible">
		<path d="M6 2.5H13.5L19.5 8.5V19.5A2 2 0 0 1 17.5 21.5H6A2 2 0 0 1 4 19.5V4.5A2 2 0 0 1 6 2.5Z" style="fill: var(--duotone-light, var(--frappe_intelligence-body))" />
		<path d="M13.5 2.5V7A1.5 1.5 0 0 0 15 8.5H19.5Z" style="fill: var(--duotone-dark, var(--frappe_intelligence-detail))" />
		<g style="fill: var(--duotone-dark, var(--frappe_intelligence-detail))"><rect class="frappe_intelligence-line" x="7" y="12" width="9.5" height="1.8" rx="0.9" /><rect class="frappe_intelligence-line" x="7" y="16" width="6.5" height="1.8" rx="0.9" /></g>
	</symbol>

	<!-- Document Requirements: a clipboard with a tick. -->
	<symbol viewBox="0 0 24 24" id="icon-frappe_intelligence-requirements-duotone" stroke="none" style="overflow: visible">
		<rect x="4.5" y="4" width="15" height="18" rx="2.2" style="fill: var(--duotone-light, var(--frappe_intelligence-body))" />
		<rect x="8.5" y="2" width="7" height="4" rx="1.2" style="fill: var(--duotone-dark, var(--frappe_intelligence-detail))" />
		<path class="frappe_intelligence-check" d="M8.5 13.5 11 16l4.8-5" style="fill: none; stroke: var(--duotone-dark, var(--frappe_intelligence-detail)); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round" />
	</symbol>

	<!-- Processing Log: a sheet of log lines. -->
	<symbol viewBox="0 0 24 24" id="icon-frappe_intelligence-log-duotone" stroke="none" style="overflow: visible">
		<rect x="4" y="2.5" width="16" height="19" rx="2.2" style="fill: var(--duotone-light, var(--frappe_intelligence-body))" />
		<g style="fill: var(--duotone-dark, var(--frappe_intelligence-detail))"><rect class="frappe_intelligence-line" x="7" y="7" width="10" height="1.8" rx="0.9" /><rect class="frappe_intelligence-line" x="7" y="11" width="10" height="1.8" rx="0.9" /><rect class="frappe_intelligence-line" x="7" y="15" width="6" height="1.8" rx="0.9" /></g>
	</symbol>

	<!-- Training Pairs: the first reading and the corrected one, with arrows between them. -->
	<symbol viewBox="0 0 24 24" id="icon-frappe_intelligence-training-duotone" stroke="none" style="overflow: visible">
		<g style="fill: var(--duotone-light, var(--frappe_intelligence-body))"><rect x="2" y="5" width="9" height="14" rx="2" /><rect x="13" y="5" width="9" height="14" rx="2" /></g>
		<path class="frappe_intelligence-swap" d="M8.5 9.5H15.5M13.8 7.8 15.5 9.5 13.8 11.2" style="fill: none; stroke: var(--duotone-dark, var(--frappe_intelligence-detail)); stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round" />
		<path class="frappe_intelligence-swap-back" d="M15.5 14.5H8.5M10.2 12.8 8.5 14.5 10.2 16.2" style="fill: none; stroke: var(--duotone-dark, var(--frappe_intelligence-detail)); stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round" />
	</symbol>

	<!-- Knowledge Packs: books on a shelf, one leaning out. -->
	<symbol viewBox="0 0 24 24" id="icon-frappe_intelligence-knowledge-duotone" stroke="none" style="overflow: visible">
		<g style="fill: var(--duotone-light, var(--frappe_intelligence-body))"><rect x="3" y="5" width="4.2" height="15.5" rx="1" /><rect x="8.2" y="3.5" width="4.2" height="17" rx="1" /></g>
		<g class="frappe_intelligence-book"><rect x="14" y="5" width="4.2" height="15.5" rx="1" transform="rotate(-14 16.1 20.5)" style="fill: var(--duotone-dark, var(--frappe_intelligence-detail))" /></g>
		<rect x="2" y="20.4" width="20" height="1.7" rx="0.85" style="fill: var(--duotone-dark, var(--frappe_intelligence-detail))" />
	</symbol>

	<!-- Post Processors: a gear around a hub. -->
	<symbol viewBox="0 0 24 24" id="icon-frappe_intelligence-processors-duotone" stroke="none" style="overflow: visible">
		<g class="frappe_intelligence-gear" style="fill: var(--duotone-light, var(--frappe_intelligence-body))">
			<circle cx="12" cy="12" r="6.6" />
			<rect x="10.5" y="2.4" width="3" height="4.2" rx="1" /><rect x="10.5" y="17.4" width="3" height="4.2" rx="1" />
			<rect x="2.4" y="10.5" width="4.2" height="3" rx="1" /><rect x="17.4" y="10.5" width="4.2" height="3" rx="1" />
			<rect x="10.5" y="2.4" width="3" height="4.2" rx="1" transform="rotate(45 12 12)" /><rect x="10.5" y="17.4" width="3" height="4.2" rx="1" transform="rotate(45 12 12)" />
			<rect x="2.4" y="10.5" width="4.2" height="3" rx="1" transform="rotate(45 12 12)" /><rect x="17.4" y="10.5" width="4.2" height="3" rx="1" transform="rotate(45 12 12)" />
		</g>
		<circle cx="12" cy="12" r="2.6" style="fill: var(--duotone-dark, var(--frappe_intelligence-detail))" />
	</symbol>

	<!-- Setup: two sliders with their knobs. -->
	<symbol viewBox="0 0 24 24" id="icon-frappe_intelligence-setup-duotone" stroke="none" style="overflow: visible">
		<g style="fill: var(--duotone-light, var(--frappe_intelligence-body))"><rect x="3" y="5.6" width="18" height="3.2" rx="1.6" /><rect x="3" y="15.2" width="18" height="3.2" rx="1.6" /></g>
		<circle class="frappe_intelligence-knob" cx="9" cy="7.2" r="3.1" style="fill: var(--duotone-dark, var(--frappe_intelligence-detail))" />
		<circle class="frappe_intelligence-knob-back" cx="15" cy="16.8" r="3.1" style="fill: var(--duotone-dark, var(--frappe_intelligence-detail))" />
	</symbol>
</svg>
